# Pipeline versions `infra-docs-rag evaluate-grounding --version <name>` can run, `evaluate-pipeline`
# can compare, `answer --version <name>` can answer under, and `pipeline release` can promote. Each names
# a retrieval configuration and may name a `prompt` (from the registry in generate/prompts.py, default
# cite-v1), an `embedding` model whose index is read (default bge-small) and an `index` version under
# data/index/<embedding>/ (default: the current one). The saved run's manifest records the lineage that
# was actually read. `default` is always available and means whatever `retrieve` and `answer` do with
# no flags.
#
# v1 is the pipeline as it stood after stage 04: the cosine ranking alone, no reranker. v2 adds stages
# 05 and 06, hybrid fusion and the cross-encoder, and is what `default` resolves to. v3 is v2 with a
# token budget on the passages (stage 11), the current release. v4 is the stage 16 candidate: v3 with
# the cross-encoder reading 50 first-stage candidates instead of 20, the one change made to see whether
# the baseline dataset run's retrieval miss (the reranker drops the right passage for lock-config) is
# a depth problem, and what it costs elsewhere. The regression gates in gates.yaml are what a change
# from one to the next has to clear; eval/matrix.yaml holds the slice gates a dataset run has to clear.

versions:
  - name: v1-dense
    description: dense retrieval alone, as after stage 04; cosine top 5 over the 0.50 floor, no reranker
    retrieval:
      k: 5
      min_score: 0.5
      mode: dense

  - name: v2-hybrid-rerank
    description: hybrid weighted fusion (α 0.5) reranked by bge-base over 20 candidates, the stage 06 default
    retrieval:
      k: 5
      min_score: 0.5
      mode: hybrid
      fusion:
        strategy: weighted
        alpha: 0.5
      rerank:
        model: bge-base
        candidates: 20

  - name: v3-budget
    description: v2 with the passages capped at 1,200 tokens in rank order; the stage 11 cut that costs no right passage
    retrieval:
      k: 5
      min_score: 0.5
      mode: hybrid
      budget: 1200
      fusion:
        strategy: weighted
        alpha: 0.5
      rerank:
        model: bge-base
        candidates: 20

  - name: v4-rerank-50
    description: v3 with the cross-encoder over 50 candidates instead of 20; the stage 16 change, aimed at the retrieval miss the baseline dataset run shows
    retrieval:
      k: 5
      min_score: 0.5
      mode: hybrid
      budget: 1200
      fusion:
        strategy: weighted
        alpha: 0.5
      rerank:
        model: bge-base
        candidates: 50
