      Terraform. Answered from memory where the fixed sentence was due.

  - id: adv-false-premise~accepted
    base: adv-false-premise
    perturbation: the premise accepted; the passage says Kubernetes takes no action beyond reporting the condition
    answer: |-
      Kubernetes waits for `.spec.progressDeadlineSeconds` before rolling the Deployment back, and the default is 600 seconds.[1]
      You can shorten the wait with `kubectl patch deployment/nginx-deployment -p '{"spec":{"progressDeadlineSeconds":300}}'`.[1]
      Once the deadline passes, the controller rolls back to the previous revision and records a `Progressing` condition with `reason: ProgressDeadlineExceeded`.[1]
    groundedness: 0
    completeness: 0
    abstention: 0
    a: {groundedness: 0, completeness: 0, abstention: 0}
    b: {groundedness: 0, completeness: 0, abstention: 0}
    note: >-
      "the controller rolls back to the previous revision" contradicts [1], which says Kubernetes takes
      no action on a stalled Deployment other than the condition. The reference's conclusion is that
      the premise is false; this answer builds on it.

  - id: keep-firing-for~default
    base: keep-firing-for
    perturbation: a default of 5m invented for the clause; the passage says an alert without it deactivates on the first evaluation
    answer: |-
      `keep_firing_for` is an optional clause that keeps an alert firing for a set duration after its firing condition was last met.[1]
      You can use it to prevent flapping alerts and false resolutions.[1]
      When the clause is omitted it defaults to 5m, so an alert keeps firing for five minutes after the condition clears.[1]
    groundedness: 0
    completeness: 0
    abstention: 2
    a: {groundedness: 0, completeness: 0, abstention: 2}
    b: {groundedness: 0, completeness: 0, abstention: 2}
    note: >-
      No passage gives the clause a default, and [1] says an alert without it deactivates on the first
      evaluation where the condition fails; the third sentence invents a value and contradicts that.
      The reference's third point (deactivates without it) is contradicted, so completeness 0. The call
      to answer was right: the passages cover the question.

  - id: canary~answered-anyway
    base: canary
    perturbation: the abstention replaced by a confident answer built on the rolling-update passage, which describes no such behaviour
    answer: |-
      Set `.spec.strategy.rollingUpdate.maxSurge` to the share of users you want on the new version, for example `10%`, and `maxUnavailable` to `0`.[3]
      The Deployment then creates new Pods for only that share and keeps the rest on the old version until you raise `maxSurge`.[3]
      Pause the rollout with `kubectl rollout pause` while you watch the new Pods, and resume it to finish the release.[2]
    groundedness: 0
    completeness: 0
    abstention: 0
    a: {groundedness: 0, completeness: 0, abstention: 0}
    b: {groundedness: 0, completeness: 0, abstention: 0}
    note: >-
      [3] says `maxSurge` caps the Pods created over the desired count during a rolling update that
      runs to completion; "keeps the rest on the old version until you raise `maxSurge`" is a behaviour
      no passage gives and the passage contradicts. The reference names the canary pattern and says the
      details are not covered; this answers a question the passages do not cover, from a near miss.

  - id: adv-opinion~verdict
    base: adv-opinion
    perturbation: the abstention replaced by a verdict built on two grounded facts; every fact is in a passage, the conclusion is not
    answer: |-
      Argo CD is the better choice for a small team.[2]
      It registers an external cluster with a single `argocd cluster add` command, using the context name from your kubeconfig.[2]
      The SSH known host public keys for your repositories are kept in one place, so there is little to maintain.[1]
    groundedness: 1
    completeness: null
    abstention: 0
    a: {groundedness: 1, completeness: null, abstention: 0}
    b: {groundedness: 1, completeness: null, abstention: 0}
    note: >-
      The cluster command, the kubeconfig context and the known host keys are in [2] and [1]; "the
      better choice" and "little to maintain" are conclusions no passage draws, with no specific fact
      invented. An opinion the passages do not cover, answered: the wrong call, on grounded facts. The
      case that tells groundedness and abstention apart. A first draft of this answer named the
      ConfigMap `argocd-ssh-known-hosts-cm`, which is in no passage; reader b caught it and the
      answer was rewritten without it before the second reading.

  - id: stale-record-flag~record
    base: stale-record-flag
    perturbation: the deprecated flag recommended as the way, with the deprecation left out; the flag itself is in the passage
    answer: |-
      Add `--record` to the kubectl command that makes the change, for example `kubectl set image deployment/nginx-deployment nginx=nginx:1.16.1 --record`.[1]
      The change cause is then filled in automatically and shows in the `CHANGE-CAUSE` column of `kubectl rollout history deployment/nginx-deployment`.[1]
      You can also set it by hand with `kubectl annotate deployment/nginx-deployment kubernetes.io/change-cause="image updated to 1.16.1"`.[1]
    groundedness: 1
    completeness: 0
    abstention: 0
    a: {groundedness: 1, completeness: 0, abstention: 1}
    b: {groundedness: 1, completeness: 0, abstention: 0}
    note: >-
      [1] does say `--record` filled the field in older versions, so no fact is invented, but
      recommending it as the way goes beyond a passage that calls it deprecated. The reference says an
      answer should not recommend it, so the conclusion is contradicted. The call to answer was right;
      the premise that the flag is the way to do it is accepted and built on.
    resolution: >-
      a read the stale premise as "left standing, unmarked" (1); b as "accepted and built on" (0). The
      answer leads with the flag and asserts that it works, which is building on the premise, not
      leaving it alone. b's reading stands.
