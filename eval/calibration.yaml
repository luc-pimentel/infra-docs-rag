      Declare an `aws_s3_bucket` resource in a module directory, expose the bucket name as a variable and output the bucket's ARN.
      Call the module from your root configuration with `source = "./modules/s3-bucket"` and run `terraform init` and `terraform apply`.
    groundedness: 0
    completeness: null
    abstention: 0
    a: {groundedness: 0, completeness: null, abstention: 0}
    b: {groundedness: 0, completeness: null, abstention: 0}
    note: >-
