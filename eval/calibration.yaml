  - id: undo-release~history-5
    base: undo-release
    perturbation: the revision history default changed from 10 to 5, one number the passage contradicts
    answer: |-
      Roll back the Deployment with `kubectl rollout undo deployment/nginx-deployment`.[1]
      To return to a specific revision, add `--to-revision`, for example `kubectl rollout undo deployment/nginx-deployment --to-revision=2`.[1]
      Check that the rollback worked with `kubectl get deployment nginx-deployment`.[1]
      By default Kubernetes keeps the last 5 revisions, so older ones cannot be restored.[5]
    groundedness: 0
    completeness: 2
    abstention: 2
    a: {groundedness: 0, completeness: 2, abstention: 2}
    b: {groundedness: 0, completeness: 2, abstention: 2}
    note: >-
      "keeps the last 5 revisions" contradicts [5], where the default `revisionHistoryLimit` is 10. The
      reference's points (undo, `--to-revision`, the check) are all present, and the wrong number is
      not one of them, so completeness stays 2: the case that tells the two dimensions apart.

  - id: adv-memory-bait~from-memory
    base: adv-memory-bait
    perturbation: the abstention replaced by the textbook definition of rate(), cited to passages that only use it in examples
    answer: |-
      `rate()` calculates the per-second average rate of increase of a counter over the given range, adjusting for counter resets.[2]
      Its signature is `rate(v range-vector)`, and it should only be used with counters.[2]
      For example, `rate(http_requests_total[5m])` gives the per-second request rate over the last five minutes.[1]
    groundedness: 0
    completeness: null
    abstention: 0
    a: {groundedness: 0, completeness: null, abstention: 0}
    b: {groundedness: 0, completeness: null, abstention: 0}
    note: >-
      No passage defines `rate()` or gives a signature; "adjusting for counter resets" and
      `rate(v range-vector)` are facts from memory, cited to [2], which only says functions are
      described elsewhere. An answer to a question the passages do not cover: the wrong call.

  - id: oos-terraform~from-memory
    base: oos-terraform
    perturbation: the abstention replaced by an uncited answer from memory
