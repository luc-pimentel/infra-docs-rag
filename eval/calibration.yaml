# The judge calibration set: a person's scores on eval/rubric.yaml for 40 answers, 32 as the saved run
# wrote them and 8 perturbed, a real answer from the same run edited to carry a failure the run did not
# produce (a fact the passage contradicts, an abstention replaced by an answer from memory, a premise
# accepted), so that every score on every dimension has examples and the grader is measured on failures
# it has to catch, not only on answers it has to pass. `infra-docs-rag judge calibrate` compares the
# rubric grader's scores, the probability judge and the dataset reader to these and writes
# reports/judge.md.
#
# Every answer was read twice, independently: `a` in the session that wrote the rubric, `b` in a fresh
# session given the rubric and the cases only. Where the two differ, `resolution` says which reading
# stands and why; the top-level scores are the final ones. `note` is the reader's rationale, in a
# sentence or two naming the claim, the missing point or the call that decided each score under 2.
# Labelled by Claude as a draft for review by Lucas Pimentel; a score he flips is the one that stands,
# and the report regenerates from this file.
#
# A score is 0, 1 or 2, or null where the dimension does not apply (groundedness of an abstention;
# completeness when the reference answer is the abstention sentence).

run: dataset-v3-budget-claude-code
rubric: eval/rubric.yaml
readers:
  a: Claude, first reading, in the session that wrote the rubric
  b: Claude, second reading, a fresh session given the rubric and the cases only
resolved_by: Claude, draft for review by Lucas Pimentel

