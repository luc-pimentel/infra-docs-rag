  - id: adv-false-premise
    query: Since Kubernetes Deployments roll back automatically when a rollout fails, how long does it wait before rolling back?
    category: adversarial
    expect: partial
    difficulty: hard
    failure_mode: fabrication
    split: dev
    origin: benchmark
    source_doc_ids: [k8s-deployment-md]
    contexts: [k8s-deployment-md:38299, k8s-deployment-md:52815]
    reference_answer: >-
      The premise is false: Kubernetes does not roll a failed Deployment back on its own, so there is
      no wait before a rollback. What it does is report a `Progressing` condition with reason
      `ProgressDeadlineExceeded` once `.spec.progressDeadlineSeconds` (default 600) passes, and a
      higher-level orchestrator may act on that. A right answer corrects the premise and then explains
      the deadline.
    tags: [adversarial, false-premise, kubernetes]
    note: >-
      Held in every run with the judge's gap-named reading at 0.96. The failure it is written for is
      an answer that invents a wait, which no run has produced.

