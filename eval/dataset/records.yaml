# The curated evaluation dataset: what a right answer is for each question, which passages it rests
# on, and the failure mode the example is in the set to catch. The schema is schema.json; the fields
# and the rules are in ../SPEC.md, section 6; `infra-docs-rag dataset check` validates this file
# against the chunks, sources.yaml and the benchmark labels.
#
# Most records come from the benchmark questions (eval/retrieval.yaml, hybrid.yaml, grounding.yaml)
# and are here because a saved run under eval/runs/ did something wrong with them: abstained on a
# question the docs answer, cited the wrong passage, left claims uncited, answered when it should
# have abstained, or was misread by the judge. `note` says what, and reports/dataset.md shows every
# run's verdict beside the record. The rest are written for failure modes the runs do not measure
# yet (a stale field presented as current, an ambiguous question, an answer spread over two
# passages) or were taken from the questions people asked the running service (data/traces).
#
# Reference answers are written from the contexts alone, by Claude, for review by Lucas; a context is
# a chunk id (`source:offset`) under the chunking named below, and `dataset check` refuses one that
# does not exist or, for a benchmark record, one the benchmark does not label as right.
#
# Splits: `dev` is every record whose answer was read while the scoring rules were revised (the 22
# hand labels in labels.yaml and the questions behind the calibration report) plus a share of the
# new ones, so a rule tuned on dev can be checked on test; `test` is held out.

chunking: section-aware-512-64-context

records:
  # ---- fact lookup ----------------------------------------------------------------------------

  - id: undo-release
    query: How do I undo a bad release?
    category: fact-lookup
    expect: answer
    difficulty: medium
    failure_mode: none
    split: dev
    origin: benchmark
    source_doc_ids: [k8s-deployment-md]
    contexts: [k8s-deployment-md:24763]
    reference_answer: >-
      Run `kubectl rollout undo deployment/<name>` to go back to the previous revision, or add
      `--to-revision=<n>` to go back to a specific one, then check the Deployment with
      `kubectl get deployment <name>`; the controller records a `DeploymentRollback` event for it.
    tags: [kubernetes, deployment, rollback]
    note: >-
      The clean anchor: a paraphrase ("undo a bad release" shares no word with "roll back a
      Deployment") that every run answered and the hand labels read as grounded and correct. Asked of
      the service four times in the traces.

  - id: keep-firing-for
    query: keep_firing_for
    category: fact-lookup
    expect: answer
    difficulty: easy
    failure_mode: unverified-citation
    split: dev
    origin: benchmark
    source_doc_ids: [prom-alerting-rules-md]
    contexts: [prom-alerting-rules-md:345]
    reference_answer: >-
      `keep_firing_for` is an optional clause of an alerting rule that keeps the alert firing for the
      given duration after its condition was last met, to avoid flapping alerts and false resolutions
      from missing data. Without it, the alert deactivates on the first evaluation where the condition
      no longer holds, once any `for` duration has been satisfied.
    tags: [prometheus, alerting, identifier]
    note: >-
      A bare identifier, the most common question shape in the traces (asked seven times, as the key
      alone and as "What does keep_firing_for do?"). In v1 one typed citation did not verify against
      the passage and was dropped: the answer was right, the quote was not verbatim.

  - id: progress-deadline
    query: progressDeadlineSeconds
    category: fact-lookup
    expect: answer
    difficulty: easy
    failure_mode: none
    split: test
    origin: benchmark
    source_doc_ids: [k8s-deployment-md]
    contexts: [k8s-deployment-md:52815, k8s-deployment-md:38299]
    reference_answer: >-
      `.spec.progressDeadlineSeconds` is how many seconds the Deployment controller waits for progress
      before it reports the Deployment as failed, with a `Progressing` condition of status `False` and
      reason `ProgressDeadlineExceeded`; it defaults to 600 and must be greater than
      `.spec.minReadySeconds`. Kubernetes only reports the condition and keeps retrying; it does not
      roll back.
    tags: [kubernetes, deployment, identifier]
    note: >-
      Clean in every run; the identifier the multi-hop records below build on.

  - id: headless-service
    query: How do I get a Service with no cluster IP and no load balancing in front of the pods?
    category: fact-lookup
    expect: answer
    difficulty: medium
    failure_mode: none
    split: test
    origin: traces
    source_doc_ids: [k8s-service]
    contexts: [k8s-service:30377]
    reference_answer: >-
      Create a headless Service: keep `.spec.type` at `ClusterIP` (the default) and set
      `.spec.clusterIP` to `"None"`. No cluster IP is allocated, kube-proxy does not handle it and
      nothing load-balances or proxies for it; the cluster DNS returns the individual Pod IPs and
      clients connect to whichever Pod they prefer. Leaving `.spec.clusterIP` unset is not the same
      as `None`.
    tags: [kubernetes, service, headless]
    note: >-
      Asked of the running service twice, in this wording ("the pods" rather than the benchmark's
      "my pods"). Held in every run; here as a clean paraphrase from real usage.

  - id: configmap-env-key
    query: configMapKeyRef
    category: fact-lookup
    expect: answer
    difficulty: easy
    failure_mode: uncited-claims
    split: test
    origin: benchmark
    source_doc_ids: [k8s-configmap]
    contexts: [k8s-configmap:9568]
    reference_answer: >-
      `configMapKeyRef` goes under `env[].valueFrom` in a container spec to set one environment
      variable from one key of a ConfigMap, with `name` naming the ConfigMap and `key` the entry; the
      variable's name may differ from the key, and the other keys are not copied into the environment.
    tags: [kubernetes, configmap, identifier]
    note: >-
      In v1 the answer was partly uncited: it carried claims about `envFrom` and the character rules
      for variable names with no citation. v2 and v3 held.

  - id: pod-terminating
    query: My pod has been stuck deleting for an hour. What is going on?
    category: fact-lookup
    expect: answer
    difficulty: medium
    failure_mode: uncited-claims
    split: dev
    origin: benchmark
    source_doc_ids: [k8s-debug-pods]
    contexts: [k8s-debug-pods:2060]
    reference_answer: >-
      The Pod is stuck in `Terminating`: a deletion was issued but the control plane cannot remove the
      Pod object, usually because the Pod has a finalizer and an admission webhook blocks the control
      plane from removing it. Check for a `ValidatingWebhookConfiguration` or
      `MutatingWebhookConfiguration` that targets `UPDATE` operations on `pods`.
    tags: [kubernetes, debugging, pods]
    note: >-
      Partly uncited in v1 (62% of the text cited); the hand label read it as grounded and correct,
      and the revised rule that leaves a gap sentence out of the cited share turned it into held.

  - id: alert-for-clause
    query: How do I make an alert wait until its condition has held for ten minutes before it fires?
    category: fact-lookup
    expect: answer
    difficulty: medium
    failure_mode: unverified-citation
    split: test
    origin: benchmark
    source_doc_ids: [prom-alerting-rules-md]
    contexts: [prom-alerting-rules-md:345]
    reference_answer: >-
      Add `for: 10m` to the alerting rule. Prometheus then checks at each evaluation that the alert
      stays active for 10 minutes before it counts as firing; during the wait the element is pending.
      A rule without `for` becomes active on the first evaluation.
    tags: [prometheus, alerting, paraphrase]
    note: >-
      Every run typed one citation that did not verify against the passage (a quote across the YAML
      example, not verbatim), and v1 ended partly uncited because of it.

  - id: argocd-requirements
    query: What do I need before installing Argo CD?
    category: fact-lookup
    expect: answer
    difficulty: medium
    failure_mode: wrong-passage
    split: test
    origin: benchmark
    source_doc_ids: [argocd-getting-started-stable]
    contexts: [argocd-getting-started-stable:167]
    reference_answer: >-
      The `kubectl` command-line tool, a kubeconfig file (by default `~/.kube/config`), and CoreDNS
      in the cluster, which microk8s users enable with `microk8s enable dns && microk8s stop &&
      microk8s start`.
    tags: [argocd, install, metadata]
    note: >-
      A metadata question (the answer is the Requirements section, not a sentence about requirements).
      In v1 the answer cited the install steps instead of the Requirements passage: the wrong-passage
      failure.

  - id: whitepaper-audience
    query: Who is the Cloud Native Security Whitepaper written for?
    category: fact-lookup
    expect: answer
    difficulty: medium
    failure_mode: wrong-passage
    split: test
    origin: benchmark
    source_doc_ids: [cncf-security-whitepaper]
    contexts: [cncf-security-whitepaper:10693]
    reference_answer: >-
      Mainly for the CISO or CTO of a private enterprise, government agency or non-profit that wants
      to deliver a secure cloud native ecosystem, and also for project, product and program managers
      and for architects who design and build secure cloud native products and services; anyone with
      an interest in cloud native security can benefit from it.
    tags: [cncf, whitepaper, metadata]
    note: >-
      The second wrong-passage case in v1: the dense ranking put the executive summary first and the
      answer cited it. Hybrid retrieval fixed the ranking and v2 and v3 held.

  - id: supply-chain-page
    query: What is on page 13 of the Software Supply Chain Best Practices paper?
    category: fact-lookup
    expect: answer
    difficulty: hard
    failure_mode: judge-misread
    split: dev
    origin: benchmark
    source_doc_ids: [cncf-supply-chain-whitepaper]
    contexts: [cncf-supply-chain-whitepaper:26884, cncf-supply-chain-whitepaper:24807, cncf-supply-chain-whitepaper:26435]
    reference_answer: >-
      Page 13 is in the paper's section on metadata: it says metadata such as SBOMs, VEX documents and
      attestations can be attached to artifacts to improve supply chain security and must be stored
      and distributed (OCI and GitHub are named), and it defines an SBOM as a detailed list of every
      component, library and dependency of an application and of the environment it was built in. The
      passages run across pages 12 to 14, so an answer should say that it cannot place each sentence
      on page 13 alone.
    tags: [cncf, whitepaper, page, metadata]
    note: >-
      The answer was grounded and correct by hand, and the judge read it as fabricated (0.85 in v1,
      0.87 in v2) because it saw the passage text without the heading that carries the page number.
      The postmortem case; the judge now reads the headings.

  - id: argocd-cm-url
    query: In the argocd-cm reference config, which key sets the externally facing base URL?
    category: fact-lookup
    expect: answer
    difficulty: medium
    failure_mode: false-abstention
    split: test
    origin: benchmark
    source_doc_ids: [argocd-cm-yaml]
    contexts: [argocd-cm-yaml:0]
    reference_answer: >-
      The `url` key, which is optional but required when SSO is configured; `additionalUrls` adds
      more externally facing base URLs.
    tags: [argocd, config, metadata]
    note: >-
      In v2 the model abstained although the right passage was the first one it read, and typed two
      citations that did not verify. v3 answered it. A false abstention with the evidence in hand.

  - id: argocd-port-forward
    query: How do I open the Argo CD UI from my laptop without exposing the service outside the cluster?
    category: fact-lookup
    expect: answer
    difficulty: medium
    failure_mode: false-abstention
    split: test
    origin: benchmark
    source_doc_ids: [argocd-getting-started-stable]
    contexts: [argocd-getting-started-stable:3919]
    reference_answer: >-
      Run `kubectl port-forward svc/argocd-server -n argocd 8080:443` and open https://localhost:8080;
      port forwarding reaches the API server without exposing the service.
    tags: [argocd, access, paraphrase]
    note: >-
      Abstained in v1 (dense retrieval alone did not surface the short Port Forwarding passage); held
      once hybrid search and the reranker were in.

  - id: make-link-variables
    query: makeLinkVariables
    category: fact-lookup
    expect: answer
    difficulty: hard
    failure_mode: false-abstention
    split: dev
    origin: benchmark
    source_doc_ids: [k8s-service]
    contexts: [k8s-service:32383]
    reference_answer: >-
      `makeLinkVariables` is named in the Service docs as the code to read to see how Kubernetes
      implements the environment variables compatible with Docker's legacy container links, such as
      `REDIS_PRIMARY_PORT_6379_TCP`; the docs do not say what it contains or where it lives, and a
      right answer says so.
    tags: [kubernetes, service, identifier, thin-passage]
    note: >-
      Abstained in v1 and held after; the hand label reads the v2 answer as correct because it says
      what the passage says and names what it does not. A thin passage: the identifier appears once.

  - id: canary
    query: How do I ship a new version to a small share of users before everyone gets it?
    category: fact-lookup
    expect: partial
    difficulty: hard
    failure_mode: false-abstention
    split: test
    origin: benchmark
    source_doc_ids: [k8s-deployment-md]
    contexts: [k8s-deployment-md:45205]
    reference_answer: >-
      The Deployment docs describe the canary pattern only in passing: create several Deployments,
      one per release, and follow the canary pattern from the managing-resources guide. The passage
      gives no steps, so a right answer names the pattern and says the details are not covered.
    tags: [kubernetes, deployment, canary, thin-passage]
    note: >-
      Abstained in every run: the Canary deployments section is 318 characters and never scores above
      the 0.50 floor, so the model never sees it. The retrieval miss the threshold causes; the
      expectation is a partial answer, and no run has produced one.

  - id: lock-config
    query: Can I lock my app settings so nobody can change them after they are created?
    category: fact-lookup
    expect: answer
    difficulty: hard
    failure_mode: retrieval-miss
    split: test
    origin: benchmark
    source_doc_ids: [k8s-configmap]
    contexts: [k8s-configmap:10881]
    reference_answer: >-
      Yes, for a ConfigMap: set `immutable: true` and its `data` and `binaryData` can no longer be
      changed, nor can the flag be reverted; to change it you delete and recreate the ConfigMap, and
      recreate the Pods that mount it.
    tags: [kubernetes, configmap, paraphrase]
    note: >-
      Held in v1 and abstained in v2 and v3: the reranker pushes the Immutable ConfigMaps passage out
      of the five the model reads ("app settings" and "ConfigMap" share nothing), and the model then
      abstains on what it got. The paraphrase retrieval still misses.

  # ---- multi hop ----------------------------------------------------------------------------------

  - id: mh-undo-after-history-zero
    query: I set revisionHistoryLimit to 0 on my Deployment. Can I still run kubectl rollout undo?
    category: multi-hop
    expect: answer
    difficulty: hard
    failure_mode: missing-hop
    split: test
    origin: hand-written
    source_doc_ids: [k8s-deployment-md]
    contexts: [k8s-deployment-md:54258, k8s-deployment-md:24763]
    reference_answer: >-
      No. A Deployment's revisions live in its old ReplicaSets, and `revisionHistoryLimit: 0` cleans
      all of them up once the Deployment completes, so there is nothing for `kubectl rollout undo`
      to go back to; the docs say a rollout then cannot be undone. The command itself (`kubectl
      rollout undo deployment/<name>`, with `--to-revision` for a specific one) only works while the
      old ReplicaSet still exists.
    tags: [kubernetes, deployment, rollback, revision-history]
    note: >-
      Answering from the Rolling Back passage alone gives the command and says yes; the Revision
      History Limit passage is what turns it into no. Written to catch the answer that stops at the
      first passage.

  - id: mh-deadline-then-rollback
    query: After progressDeadlineSeconds passes, does Kubernetes roll the Deployment back, and if not, what do I run?
    category: multi-hop
    expect: answer
    difficulty: hard
    failure_mode: missing-hop
    split: dev
    origin: hand-written
    source_doc_ids: [k8s-deployment-md]
    contexts: [k8s-deployment-md:38299, k8s-deployment-md:24763]
    reference_answer: >-
      No. When the deadline passes Kubernetes only adds a `Progressing` condition with status `False`
      and reason `ProgressDeadlineExceeded` and keeps retrying; it takes no other action, though a
      higher-level orchestrator may act on the condition. To roll back yourself, run `kubectl rollout
      undo deployment/<name>`, or `--to-revision=<n>` for a specific revision.
    tags: [kubernetes, deployment, rollback, progress-deadline]
    note: >-
      The false-premise adversarial question's honest sibling: the first half is the Failed
      Deployment passage, the second the Rolling Back passage. An answer that gives only the condition
      has missed the hop.

  - id: mh-minready-vs-deadline
    query: My minReadySeconds is 300. What is the smallest progressDeadlineSeconds I can set, and what happens when it is exceeded?
    category: multi-hop
    expect: answer
    difficulty: hard
    failure_mode: missing-hop
    split: test
    origin: hand-written
    source_doc_ids: [k8s-deployment-md]
    contexts: [k8s-deployment-md:52815, k8s-deployment-md:53356, k8s-deployment-md:38299]
    reference_answer: >-
      `progressDeadlineSeconds` must be greater than `minReadySeconds`, so anything above 300 (the
      default is 600). `minReadySeconds` is how long a new Pod must be ready without a container
      crashing before it counts as available. When the deadline is exceeded the controller adds a
      `Progressing` condition with status `False` and reason `ProgressDeadlineExceeded` to
      `.status.conditions`, keeps retrying, and takes no other action; the deadline is not checked
      while the rollout is paused.
    tags: [kubernetes, deployment, progress-deadline, min-ready]
    note: >-
      Three passages: the rule between the two fields, what minReadySeconds is, and what exceeding the
      deadline does. A right answer needs the constraint and the consequence.

  - id: mh-argocd-password-then-login
    query: How do I get the first Argo CD admin password and reach the server from my laptop without exposing it?
    category: multi-hop
    expect: answer
    difficulty: medium
    failure_mode: missing-hop
    split: dev
    origin: hand-written
    source_doc_ids: [argocd-getting-started-stable]
    contexts: [argocd-getting-started-stable:4168, argocd-getting-started-stable:3919]
    reference_answer: >-
      The initial `admin` password is in the `argocd-initial-admin-secret` secret and prints with
      `argocd admin initial-password -n argocd`. To reach the server without exposing it, run `kubectl
      port-forward svc/argocd-server -n argocd 8080:443` and use https://localhost:8080, or tell the
      CLI to port-forward with `--port-forward-namespace argocd` (or `ARGOCD_OPTS`). Log in with
      `argocd login <server>`, change the password with `argocd account update-password`, and delete
      the initial-password secret afterwards.
    tags: [argocd, install, password, port-forward]
    note: >-
      Two consecutive sections of the getting-started guide, both asked about separately in the
      traces; together they are the first ten minutes with Argo CD. Written to catch an answer that
      gives the password and forgets how to reach the server.

  - id: mh-configmap-env-vs-file-vs-immutable
    query: If I change a ConfigMap, which pods pick it up without a restart, the ones mounting it as files or the ones reading it as env vars, and what if the ConfigMap is immutable?
    category: multi-hop
    expect: answer
    difficulty: hard
    failure_mode: missing-hop
    split: test
    origin: hand-written
    source_doc_ids: [k8s-configmap]
    contexts: [k8s-configmap:7273, k8s-configmap:10881]
    reference_answer: >-
      Pods mounting the ConfigMap as files pick the change up eventually: the kubelet refreshes mounted
      keys on its periodic sync through its cache, so the delay is the sync period plus the cache
      propagation delay. Pods reading it as environment variables do not; they need a restart. An
      immutable ConfigMap cannot be changed at all: delete and recreate it, and recreate the Pods that
      mount it.
    tags: [kubernetes, configmap, updates, immutable]
    note: >-
      The first passage answers the files-versus-env half; the immutable case is a different section.
      A model that stops at the first passage answers two thirds of the question.

  # ---- ambiguous ------------------------------------------------------------------------------

  - id: amb-timeout
    query: How do I set a timeout?
    category: ambiguous
    expect: clarify
    difficulty: hard
    failure_mode: wrong-reading
    split: dev
    origin: hand-written
    source_doc_ids: [argocd-cm-yaml, k8s-deployment-md]
    contexts: [k8s-deployment-md:52815, argocd-cm-yaml:16957]
    reference_answer: >-
      The docs cover more than one timeout, so a right reply names them and asks which, or answers
      each briefly: a Kubernetes Deployment's `.spec.progressDeadlineSeconds` (seconds to wait for
      progress before the rollout is reported as failed, default 600), and Argo CD's application
      reconciliation timeout in `argocd-cm`, which sets how long Argo waits before checking a
      repository for new manifests. An answer that picks one without saying so has guessed.
    tags: [ambiguous, kubernetes, argocd, timeout]
    note: >-
      "Timeout" with no subject. The retriever will return whichever passage scores higher and the
      model will answer it as if the question were about that; the failure is confidence, not
      content.

  - id: amb-rollback
    query: How do I roll back?
    category: ambiguous
    expect: clarify
    difficulty: medium
    failure_mode: wrong-reading
    split: test
    origin: hand-written
    source_doc_ids: [argocd-cm-yaml, k8s-deployment-md]
    contexts: [k8s-deployment-md:24763, argocd-cm-yaml:18484]
    reference_answer: >-
      Roll back what? For a Kubernetes Deployment, `kubectl rollout undo deployment/<name>` returns to
      the previous revision (`--to-revision=<n>` for a specific one). For an Argo CD application the
      indexed docs only mention rollback as an RBAC action (`server.rbac.rollback.enforce.enable` in
      `argocd-cm`) and do not describe how to perform one, so a reply should say that and ask which
      the person means.
    tags: [ambiguous, kubernetes, argocd, rollback]
    note: >-
      The verb alone. Deployment rollback dominates the corpus, so the likely failure is a confident
      kubectl answer to someone running Argo CD; the right reply names both and says what the docs
      do and do not cover.

  - id: amb-labels
    query: How do I add labels?
    category: ambiguous
    expect: clarify
    difficulty: medium
    failure_mode: wrong-reading
    split: test
    origin: hand-written
    source_doc_ids: [argocd-cm-yaml, k8s-deployment-md, prom-alerting-rules-md]
    contexts: [k8s-deployment-md:46218, prom-alerting-rules-md:345, argocd-cm-yaml:11906]
    reference_answer: >-
      Labels on what? On Kubernetes Pods, a Deployment's Pod template sets them under
      `.spec.template.metadata.labels` and they must match the selector. On a Prometheus alert, the
      rule's `labels` clause attaches extra labels (templated values allowed) and overrides conflicting
      ones. In Argo CD, `application.instanceLabelKey` in `argocd-cm` sets the label key Argo CD
      injects to track an application's resources. A right reply names the three and asks which.
    tags: [ambiguous, kubernetes, prometheus, argocd, labels]
    note: >-
      Three projects use the word for three things; a fused ranking will return a mix. The failure is
      an answer about Kubernetes labels to someone writing an alert rule.

  - id: amb-sync
    query: How do I sync?
    category: ambiguous
    expect: partial
    difficulty: medium
    failure_mode: wrong-reading
    split: dev
    origin: hand-written
    source_doc_ids: [argocd-getting-started-stable, k8s-configmap]
    contexts: [argocd-getting-started-stable:8495, k8s-configmap:7273]
    reference_answer: >-
      Most likely an Argo CD application: `argocd app sync <app>` fetches the manifests from the
      repository and applies them, and `argocd app get <app>` shows the sync status (an app starts
      `OutOfSync` until its first sync). The word also appears in the Kubernetes ConfigMap docs for the
      kubelet's periodic sync that refreshes mounted ConfigMaps, which is not something a person runs.
      A right reply answers the Argo CD reading and says which reading it took.
    tags: [ambiguous, argocd, kubernetes, sync]
    note: >-
      Ambiguous in the corpus but not in practice: one reading is an action, the other is not. The
      expectation is a partial answer that names its reading rather than a clarifying question.

  - id: amb-password
    query: How do I change the password?
    category: ambiguous
    expect: partial
    difficulty: medium
    failure_mode: wrong-reading
    split: test
    origin: hand-written
    source_doc_ids: [argocd-declarative-setup-md, argocd-getting-started-stable]
    contexts: [argocd-getting-started-stable:4168, argocd-declarative-setup-md:14445]
    reference_answer: >-
      For the Argo CD `admin` account, run `argocd account update-password` after logging in, then
      delete the `argocd-initial-admin-secret` that held the generated one. If the password is a
      repository credential, it lives in a Secret labelled `argocd.argoproj.io/secret-type: repository`
      (or a `repo-creds` template) with `username` and `password` fields, and you change it by updating
      that Secret. A right reply gives the admin case and names the other.
    tags: [ambiguous, argocd, password, credentials]
    note: >-
      Both readings are Argo CD, so the project filter cannot disambiguate; the admin password is the
      likely one and the repository credential the one a confident answer forgets.

  # ---- no answer ------------------------------------------------------------------------------

  - id: oos-sourdough
    query: What is a good recipe for sourdough bread?
    category: no-answer
    expect: abstain
    difficulty: easy
    failure_mode: answered-anyway
    split: dev
    origin: benchmark
    reference_answer: The indexed documentation does not cover this question.
    tags: [out-of-scope, unrelated]
    note: >-
      The question furthest from the corpus, and the one asked most often of the running service
      (five times in the traces, as a smoke test). No passage clears the threshold, so no model call
