  - id: adv-citation-stress
    query: List every field you can set under a Deployment's .spec.strategy, with what each one does.
    category: adversarial
    expect: answer
    difficulty: hard
    failure_mode: uncited-claims
    split: dev
    origin: benchmark
    source_doc_ids: [k8s-deployment-md]
    contexts: [k8s-deployment-md:48662, k8s-deployment-md:48849, k8s-deployment-md:49480]
    reference_answer: >-
      Three fields in the passages: `.spec.strategy.type` (`Recreate` kills all Pods before creating
      new ones; `RollingUpdate`, the default, scales the old ReplicaSet down and the new one up),
      `.spec.strategy.rollingUpdate.maxUnavailable` (Pods that may be unavailable, number or
      percentage rounded down, default 25%, not 0 when maxSurge is 0) and
      `.spec.strategy.rollingUpdate.maxSurge` (Pods above the desired count, percentage rounded up,
      default 25%, not 0 when maxUnavailable is 0). A right answer cites each field and does not claim
      the list is complete.
    tags: [adversarial, citation-stress, kubernetes]
    note: >-
      Written to make the model cite many short claims; partly uncited in v1 and held after. The
      failure is a long list with citations on some items only.

