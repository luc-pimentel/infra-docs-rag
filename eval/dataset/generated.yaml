  reference_answer: 'Have alerts that check that Prometheus servers, Alertmanagers, PushGateways and other
    monitoring infrastructure are available and running correctly. Where possible, alert on symptoms rather
    than causes: an end-to-end blackbox test that alerts get from PushGateway to Prometheus to Alertmanager
