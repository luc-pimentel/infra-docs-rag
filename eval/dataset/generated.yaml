  section: Alerting rules › Inspecting alerts during runtime
  query: How can I query in PromQL which Prometheus alerts are currently pending or firing?
  reference_answer: Prometheus stores synthetic time series of the form ALERTS{alertname="<alert name>",
    alertstate="<pending or firing>", <additional alert labels>} for pending and firing alerts. The sample
    value is 1 while the alert is in that state, and the series is marked stale once it no longer is.
    To check them by hand, the "Alerts" tab of the Prometheus instance shows the exact label sets for
    which each alert is active.
