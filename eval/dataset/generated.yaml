  reference_answer: Delete the pod and create it again with validation, for example `kubectl apply --validate
    -f mypod.yaml`, which reports unknown fields such as a misspelled `commnd`. Then run `kubectl get
    pods/mypod -o yaml > mypod-on-apiserver.yaml` and compare it with your original file. Extra lines
