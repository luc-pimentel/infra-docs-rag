  query: How do I stop Argo CD from watching high-volume resource kinds so it uses less memory and puts
    less load on the API server?
  reference_answer: Add a `resource.exclusions` list to argocd-cm. Each entry gives glob patterns for
    `apiGroups`, `kinds` and `clusters`, and any of those fields you leave out matches everything. events.k8s.io
    and metrics.k8s.io are already excluded by default.
