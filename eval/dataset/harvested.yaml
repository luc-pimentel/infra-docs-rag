- id: live-715176d1
  query: Does Argo CD support Kustomize?
  category: fact-lookup
  expect: answer
  difficulty: easy
  failure_mode: none
  split: test
  origin: traces
  source_doc_ids:
  - argocd-declarative-setup-md
  contexts:
  - argocd-declarative-setup-md:30979
  - argocd-declarative-setup-md:68544
  - argocd-declarative-setup-md:67671
  reference_answer: Yes. Argo CD runs Kustomize operations when it works with repositories. It uses exec
    to call Kustomize and applies the repository's proxy/noProxy settings to those operations. The recommended
    way to have Argo CD manage itself is a Kustomize-based application built on the base Argo CD manifests.
    The docs also recommend Kustomize patches for customizing Argo CD deployments.
  tags:
  - argo-cd
  - kustomize
  - yes-no
  - indirect-evidence
  - hedged-answer
  note: Harvested from live traffic (2026-10-16, trace 715176d165ce), sampled as uncited, long-context;
    the service answered with 73% of claims cited. No passage says outright that Argo CD supports Kustomize,
    but together they clearly show it does; the service correctly answered yes, cited each claim and named
    what the passages leave out, so this example checks that indirect evidence gets an answer instead
    of a false abstention. Reference drafted by the model from the passages, for review.
