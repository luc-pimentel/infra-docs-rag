name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: tesseract (the OCR fallback the PDF tests exercise)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: uv sync --frozen
      - name: lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: tests
        run: uv run pytest -q
      - name: evaluation gates on the saved runs
        # No model call: the gates read the committed runs. The benchmark gates compare the two latest
        # releases; the dataset gates read the baseline dataset run against the matrix.
        run: |
          uv run infra-docs-rag evaluate-pipeline --baseline v2-hybrid-rerank-claude-code --candidate v3-budget-claude-code
          uv run infra-docs-rag dataset metrics --run dataset-v3-budget-claude-code
      - name: regression baseline, the saved comparison and the trace diagnosis
        # No model call: the pin has to match its run and the dataset it answered, and the committed
        # candidate's comparison regenerates from the saved runs (the drift check below reads it). The
        # exit code of `dataset compare` is the gate a change clears before it is released; the committed
        # candidate is an experiment whose decision the report records, so it is not asserted here.
        run: |
          uv run infra-docs-rag dataset baseline check
          uv run infra-docs-rag dataset freeze --check
          uv run infra-docs-rag dataset compare --candidate dataset-v4-rerank-50-claude-code --no-block
          uv run infra-docs-rag dataset diagnose --run dataset-v3-budget-claude-code --run dataset-v4-rerank-50-claude-code
      - name: judge calibration on the saved grades
        # No model call either: the grader's saved scores against the hand labels; fails when a labelled
        # answer has no grade, so a label added without `judge grade` is caught here.
        run: uv run infra-docs-rag judge calibrate
      - name: no report drift
        run: git diff --exit-code --stat -- reports/evaluation.md reports/metrics.md reports/judge.md reports/regression.md reports/traces.md || (echo "regenerate the reports and commit them" && exit 1)
